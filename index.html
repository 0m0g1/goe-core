<!DOCTYPE html>

    <style>
        /* (your existing CSS – unchanged) */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #05070a; overflow: hidden; font-family: 'Inter', system-ui, 'Segoe UI', monospace; height: 100vh; color: #e8eef2; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: crisp-edges; }
        .glass-panel { background: rgba(12, 18, 24, 0.82); backdrop-filter: blur(12px); border: 1px solid rgba(72, 92, 108, 0.5); border-radius: 18px; padding: 12px 14px; box-shadow: 0 10px 28px -8px rgba(0,0,0,0.6); transition: all 0.2s ease; }
        .ui-panel { position: absolute; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.5); letter-spacing: 0.02em; font-weight: 500; }
        .badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); padding: 6px 18px; border-radius: 40px; border: 1px solid rgba(200,180,120,0.3); font-weight: 500; white-space: nowrap; }

        .tilt-fill { position: absolute; bottom: 0; width: 100%; border-radius: 4px; background: linear-gradient(to top, #5a9e4e, #e0b050, #3a7caa); transition: height 0.08s linear; }

        .debug-panel button { background: #1e2a24; border: 1px solid #6f8862; border-radius: 40px; padding: 6px 8px; width: 100%; margin-top: 6px; color: #d4e6c2; font-size: 10px; cursor: pointer; }
        .debug-panel button.active { border-color: #5fe07a; color: #baffb0; background: #1f3a28; }
        .legend { position: absolute; bottom: 20px; right: 20px; background: rgba(6,12,14,0.7); backdrop-filter: blur(8px); border-radius: 20px; padding: 10px 14px; font-size: 9px; line-height: 1.8; border: 1px solid #3f523c; pointer-events: none; font-family: monospace; }
        .event-card { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: #0f181ef0; backdrop-filter: blur(16px); border-radius: 28px; padding: 16px 24px; max-width: 340px; border: 1px solid #adbf8f; pointer-events: none; transition: 0.2s; font-family: monospace; box-shadow: 0 12px 28px black; }
        .dialogue-overlay { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 520px; max-width: 90vw; background: #0c121cee; backdrop-filter: blur(20px); border-radius: 32px; border-top: 2px solid #4d9eff; padding: 20px; display: none; z-index: 1000; font-family: monospace; pointer-events: auto; }
        .minigame-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 520px; height: 620px; background: #03060a; border-radius: 32px; border: 2px solid #ffcf6e; z-index: 2000; display: none; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .loading-toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: #131c1c; border-radius: 60px; padding: 8px 20px; font-size: 11px; backdrop-filter: blur(8px); border: 1px solid #839b6e; display: none; z-index: 1001; }
        .loc-list::-webkit-scrollbar { width: 4px; }
        .loc-list::-webkit-scrollbar-track { background: #1a1e1c; border-radius: 4px; }
        .loc-list::-webkit-scrollbar-thumb { background: #607d4a; border-radius: 4px; }

<!DOCTYPE html>
<html>
<head><style>
    body { font-family: monospace; background: #0a0f12; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin:0; }
    h2 { color: #fbbf24; letter-spacing: 2px; } .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: #fbbf24; border: 3px solid #fbbf24; }

<body><h2>⚡ SUDOKU TRIAL</h2><div class="grid" id="board"></div><button onclick="checkWin()">VERIFY</button><p id="msg"></p><script>
    const puzzle = [5,3,0,0,7,0,0,0,0,6,0,0,1,9,5,0,0,0,0,9,8,0,0,0,0,6,0,8,0,0,0,6,0,0,0,3,4,0,0,8,0,3,0,0,1,7,0,0,0,2,0,0,0,6,0,6,0,0,0,0,2,8,0,0,0,0,4,1,9,0,0,5,0,0,0,0,8,0,0,7,9];
    const boardDiv = document.getElementById('board'); const inputs = [];
    puzzle.forEach(val => { const inp = document.createElement('input'); inp.className = 'cell' + (val ? ' fixed' : ''); inp.maxLength = 1; inp.value = val || ''; inp.oninput = e => { if(e.target.value.length && (isNaN(e.target.value) || e.target.value < '1' || e.target.value > '9')) e.target.value = ''; }; boardDiv.appendChild(inp); inputs.push(inp); });
    window.checkWin = () => { const isFull = inputs.every(i => i.value !== ''); const msgDiv = document.getElementById('msg'); if(!isFull) { msgDiv.style.color='#ef4444'; msgDiv.innerText='Incomplete.'; } else { msgDiv.style.color='#22c55e'; msgDiv.innerText='Genius! Logic prevails.'; } };
</script></body></html>

<script type="module">
    // OSMTerrainLoader is commented out — replaced by the lightweight OSMTerrainTileLoader
    // which produces only terrain/floor tiles (terrainUpdates Map) with no entity/renderFn overhead.
    import { Engine, /* OSMTerrainLoader, */ OSMEntityLoader,  OSMTerrainTileLoader, BioLoader, ElevationLoader, TerracedElevation, ElevationFormat, WeatherLoader, AviationLoader, Entity, ENTITY_TYPES, worldToScreen } from './src/GOECore.js';
    import Vector2D from 'https://esm.sh/yaphe-engine@1.0.5/src/modules/2d/vector2d.js';

    // --- PERFORMANCE CONFIGURATION ---
    // Reduced map size from 400x400 to 200x200 → 4× fewer terrain tiles
    const MAP_W = 200;
    const MAP_H = 200;
    // Lower fetch radius reduces entity count per area
    const FETCH_RADIUS_M = 800;  // was 1500

    // --- COMBINED LOCATIONS ---
    const unifiedLocations = [
        { name: "🗼 Paris - Eiffel Tower",          lat: 48.8584,   lon: 2.2945    },
        { name: "🏫 Alliance High School (Kenya)",   lat: -1.259944, lon: 36.667270 },
        { name: "🗽 New York - Times Square",        lat: 40.7580,   lon: -73.9855  },
        { name: "🇬🇧 London - Trafalgar Square",    lat: 51.5074,   lon: -0.1278   },
        { name: "🇯🇵 Tokyo - Shibuya",              lat: 35.6587,   lon: 139.7456  },
        { name: "🇩🇪 Berlin - Alexanderplatz",      lat: 52.5200,   lon: 13.4050   },
        { name: "🏺 Great Pyramid of Giza",          lat: 29.9792,   lon: 31.1342   },
        { name: "🏛️ Paris - Arc de Triomphe",       lat: 48.8738,   lon: 2.2950    },
        { name: "🎡 London - Big Ben",               lat: 51.5007,   lon: -0.1246   },
        { name: "🌉 San Francisco - Golden Gate",    lat: 37.8199,   lon: -122.4783 },

        // ── Great for TerracedElevation testing ────────────────────────────────
        { name: "🏜️ Grand Canyon South Rim",        lat: 36.0527,   lon: -112.1535 }, // ~1500m drop nearby
        { name: "🏔️ Mount Fuji",                    lat: 35.3606,   lon: 138.7274  }, // clean conical rise
        { name: "🇨🇭 Matterhorn (Zermatt)",         lat: 45.9763,   lon: 7.6586    }, // alpine sharp relief
        { name: "🇳🇵 Everest Base Camp",            lat: 28.0026,   lon: 86.8528   }, // extreme high elevation
    ];

    // --- Ball Physics Entity ---
    class BallEntity extends Entity {
        constructor(id, tx, ty) {
            super(id, ENTITY_TYPES.FEATURE, tx, ty);
            this.physicsEnabled = true;
            this.physicsRadius = 0.4;
            this.fixed = false;
            this.solid = true;
            this.color = '#ff7777';
            this.data = { label: 'ball' };
        }
        render(wr, groundElevPx, extra) {
            const { ctx, cam } = wr;
            const { x, y } = worldToScreen(this.tx + 0.5, this.ty + 0.5, groundElevPx + (this.elevOffset ?? 0), cam);
            const r = Math.max(3, cam.zoom * cam.tileW * 0.4) / 2;
            const depth = this.tx * Math.cos(cam.rotation) + this.ty * Math.sin(cam.rotation);
            wr.submitWorldObject(depth, () => {
                wr.ctx.globalAlpha = 1;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = '#ff5e5e'; ctx.fill();
                ctx.beginPath(); ctx.arc(x - r*0.2, y - r*0.2, r*0.25, 0, Math.PI*2);
                ctx.fillStyle = '#fff6cf'; ctx.fill();
            });
        }
    }

    // --- NPC & Events Data ---
    const npcMaki = {
        id: 'npc_sudoku', title: '🧩 Maki Kaji', category: 'npc', latitude: 35.6587, longitude: 139.7455,
        data: { category: 'npc', dialogue: {
            start: { text: "Traveler, I am the spirit of puzzles. Dare you test your logic?", choices: [{ text: "Enter the Sudoku trial", next: 'play_game' }, { text: "Not now", next: 'exit' }] },
            play_game: { text: "May numbers guide you.", action: 'trigger_sudoku', choices: [{ text: "Farewell", next: 'exit' }] }
        } }
    };
    const historicalEvents = [
        { id: 'hastings', title: 'Battle of Hastings', category: 'war', latitude: 50.886, longitude: 0.488, year: 1066, description: "Norman conquest reshaped England." },
        { id: 'moon', title: 'Apollo 11 Landing', category: 'science', latitude: 0.674, longitude: 23.473, year: 1969, description: "One small step for man." },
        { id: 'berlin', title: 'Fall of Berlin Wall', category: 'politics', latitude: 52.516, longitude: 13.382, year: 1989, description: "Symbol of Cold War's end." },
        npcMaki
    ];
    const categoryColorMap = { war:'#ef4444', politics:'#f59e0b', science:'#06b6d4', art:'#a78bfa', religion:'#f97316', sport:'#22c55e', npc:'#fbbf24' };
    function getEventColor(ev) { const cat = (ev.category || '').toLowerCase(); for(let k in categoryColorMap) if(cat.includes(k)) return categoryColorMap[k]; return '#90caf9'; }

    // --- Engine Initialization ---
    const canvas = document.getElementById('game-canvas');
    const engine = new Engine({
        geoCenter: { lat: 51.5074, lon: -0.1278 },
        showPlayer: true,
        tileURLFn: (z, x, y) => `https://a.tile.openstreetmap.org/${z}/${x}/${y}.png`,
        mapW: MAP_W,
        mapH: MAP_H,
        cameraOpts: { zoom: 0.42, zoomFlat: 0.18, zoomIso: 0.58, zoomSpeed: 0.0014 }
    });
    window.engine = engine;

    // --- Loaders ---
    // OSMTerrainLoader removed — OSMTerrainTileLoader only writes terrainUpdates (floor tiles),
    // no entities, no buildings, no roads, no blueprints, no elevation API calls.
    const terrainLoader = new OSMTerrainTileLoader({
        mPerTile:        2,
        fetchRadiusM:    FETCH_RADIUS_M,
        fetchDebounceMs: 800,
    });
    engine.use(terrainLoader);

    const entityLoader = new OSMEntityLoader({
        mPerTile:        2,
        fetchRadiusM:    800,
        fetchDebounceMs: 800,
    });
    engine.use(entityLoader);

    // The following loaders are unchanged
    engine.use(new BioLoader({ limit: 50, fetchRadiusM: 800 }));
    engine.use(new WeatherLoader('b69650bacdb53e8000e14a735bb53035'));
    engine.use(new AviationLoader());
    engine.use({ id: 'events', init(){}, destroy(){}, async fetch(){ return { entities: historicalEvents.map(ev => ({ id: ev.id, latitude: ev.latitude, longitude: ev.longitude, color: getEventColor(ev), label: ev.title, data: ev })) }; } });

    const elevationLoader = new ElevationLoader((z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`, ElevationFormat.TERRARIUM, 2);

    const terracedLoader = new TerracedElevation(elevationLoader, {
        stepH:    10,       // one terrace every 20 metres
        snapMode: 'floor',  // tile sits on the step *below* the raw sample
    });

    engine.setElevationLoader(terracedLoader);

    // --- Monkey-patches removed ---
    // OSMTerrainTileLoader has no _liveEntityCache or _bpGen/_memCache to patch —
    // those were OSMTerrainLoader internals that no longer exist in the tile-only loader.

    // --- Partial result callback removed ---
    // OSMTerrainTileLoader does not emit partial results or entities;
    // it resolves once with { terrainUpdates } so no streaming callback is needed.

    engine.mount(canvas);

    // --- Periodic cleanup of distant terrain tiles (unchanged) ---
    setInterval(() => {
        if (engine._tileCache && engine._tileCache.length > 8000) {
            const px = engine.playerEntity?.tx ?? 0;
            const py = engine.playerEntity?.ty ?? 0;
            engine._tileCache = engine._tileCache.filter(t => Math.abs(t.tx - px) < 60 && Math.abs(t.ty - py) < 60);
        }
    }, 10000);

    // --- UI / Fast Travel (unchanged) ---
    const locSearch = document.getElementById('loc-search');
    const locListDiv = document.getElementById('loc-list');
    function renderLocationList(query = "") {
        locListDiv.innerHTML = "";
        const coordMatch = query.match(/^(-?\d+\.?\d*)[ ,]+(-?\d+\.?\d*)$/);
        if(coordMatch) {
            const lat = parseFloat(coordMatch[1]), lon = parseFloat(coordMatch[2]);
            const geoBtn = document.createElement('button'); geoBtn.className = "geo-jump";
            geoBtn.innerText = `🎯 JUMP TO ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            geoBtn.onclick = () => { engine.camera.zoom = 0.55; engine.panTo(lat, lon); locSearch.value = ""; renderLocationList(""); };
            locListDiv.appendChild(geoBtn);
        }
        const filtered = unifiedLocations.filter(l => l.name.toLowerCase().includes(query.toLowerCase()));
        filtered.forEach(loc => {
            const btn = document.createElement('button');
            btn.innerText = loc.name;
            btn.onclick = () => { engine.camera.zoom = 0.52; engine.panTo(loc.lat, loc.lon); locSearch.value = ""; renderLocationList(""); };
            locListDiv.appendChild(btn);
        });
    }
    locSearch.addEventListener('input', e => renderLocationList(e.target.value));
    renderLocationList("");

    // --- Physics balls (unchanged) ---
    let ballIdCounter = 0;
    function updateBallUI() { document.getElementById('ball-count').innerText = `Balls: ${engine.entities.filter(e => e instanceof BallEntity).length}`; }
    function spawnBall() {
        if(!engine.playerEntity) return;
        const ball = new BallEntity(`ball_${Date.now()}_${ballIdCounter++}`, engine.playerEntity.tx + 1.2, engine.playerEntity.ty + 1.2);
        engine.addEntity(ball);
        if(ball._particle) ball._particle.damping = 0.96;
        updateBallUI();
        setTimeout(() => { engine.removeEntity(ball.id); updateBallUI(); }, 28000);
    }
    function kickNearest() {
        if(!engine.playerEntity) return;
        let closest = null, minDist = Infinity;
        for(let e of engine.entities) {
            if(e instanceof BallEntity && e._particle) {
                let d = Math.hypot(e.tx - engine.playerEntity.tx, e.ty - engine.playerEntity.ty);
                if(d < minDist) { minDist = d; closest = e; }
            }
        }
        if(closest && closest._particle) {
            let angle = Math.random() * Math.PI * 2, strength = (1.8 + Math.random() * 2) / 10;
            closest._particle.prevPosition = new Vector2D(closest._particle.position.x - Math.cos(angle) * strength, closest._particle.position.y - Math.sin(angle) * strength);
        }
    }
    document.getElementById('spawn-ball-btn').onclick = spawnBall;
    document.getElementById('kick-ball-btn').onclick = kickNearest;
    setInterval(updateBallUI, 1500);

    // --- Dialogue & Sudoku Minigame (unchanged) ---
    const dialogueBox = document.getElementById('dialogue-box'), dialogueName = document.getElementById('dialogue-name'), dialogueText = document.getElementById('dialogue-text'), dialogueChoices = document.getElementById('dialogue-choices');
    const minigameModal = document.getElementById('minigame-modal'), minigameFrame = document.getElementById('minigame-frame'), sudokuSrc = document.getElementById('sudoku-template').textContent;
    let currentNPC = null;
    function renderDialogue(nodeId) {
        if(nodeId === 'exit') { dialogueBox.style.display = 'none'; currentNPC = null; return; }
        const node = currentNPC?.data?.dialogue?.[nodeId];
        if(!node) return;
        dialogueText.innerText = node.text;
        dialogueChoices.innerHTML = '';
        if(node.action === 'trigger_sudoku') {
            minigameModal.style.display = 'block';
            minigameFrame.srcdoc = sudokuSrc;
        }
        node.choices.forEach(ch => {
            const btn = document.createElement('button'); btn.className = 'dialogue-choice'; btn.style.background='#1e2a32'; btn.style.margin='6px 0'; btn.style.padding='8px'; btn.style.borderRadius='40px'; btn.innerText = `▸ ${ch.text}`;
            btn.onclick = () => renderDialogue(ch.next);
            dialogueChoices.appendChild(btn);
        });
    }
    engine.on('entity:click', ({ entity }) => {
        const isNPC = entity.type === ENTITY_TYPES.NPC || entity.data?.category === 'npc' || entity.data?.dialogue;
        if(isNPC) {
            document.getElementById('event-card').style.display = 'none';
            currentNPC = entity.data || entity;
            dialogueName.innerText = currentNPC.title || 'Wise NPC';
            dialogueBox.style.display = 'block';
            renderDialogue('start');
            return;
        }
        dialogueBox.style.display = 'none';
        const ev = entity.data || entity;
        const card = document.getElementById('event-card');
        card.style.display = 'block';
        card.innerHTML = `<div style="font-size:9px; color:${getEventColor(ev)}">${(ev.category || 'event').toUpperCase()}</div>
                          <div style="font-weight:bold; font-size:14px;">${ev.title}</div>${ev.year ? `<div>📅 ${ev.year}</div>` : ''}
                          <div style="font-size:10px; margin-top:6px;">${ev.description || 'Historical marker'}</div>`;
        setTimeout(() => card.style.display = 'none', 4500);
    });
    engine.on('map:click', () => { dialogueBox.style.display = 'none'; document.getElementById('event-card').style.display = 'none'; });
    document.getElementById('close-game-btn').addEventListener('click', () => { minigameModal.style.display = 'none'; minigameFrame.src = 'about:blank'; });

    // --- Debug overlay & Cache ---
    const debugBtn = document.getElementById('toggle-debug-overlay-btn'), debugBadge = document.getElementById('debug-overlay-badge');
    debugBtn.addEventListener('click', () => {
        engine.toggleLayer('colliders');
        const on = engine.debugLayers.colliders;
        debugBtn.innerText = on ? "🟢 DEBUG OVERLAY: ON" : "🔘 DEBUG OVERLAY: OFF";
        debugBtn.classList.toggle('active', on);
        debugBadge.style.display = on ? 'inline-block' : 'none';
    });
    document.getElementById('clear-cache-btn').addEventListener('click', async () => { await terrainLoader?.clearCache(); alert('🗑️ Cache cleared. Reloading...'); location.reload(); });

    // --- HUD updates ---
    engine.on('hud', ({ lat, lon, zoom, tilt, terrain }) => {
        const zoomNum = Number(zoom);
        const tiltNum = Number(tilt);
        document.getElementById('hud-coords').innerHTML = `${lat.toFixed(5)}° N  ${lon.toFixed(5)}° E`;
        document.getElementById('hud-zoom').innerHTML = `zoom: ${zoomNum.toFixed(2)}×`;
        document.getElementById('hud-tilt').innerHTML = `tilt: ${(tiltNum * 100).toFixed(0)}%`;
        document.getElementById('hud-terrain').innerHTML = terrain;
        document.getElementById('tilt-fill').style.height = (tiltNum * 100) + '%';
        const badge = document.getElementById('mode-badge');
        if(tiltNum < 0.1) badge.style.color = '#4f8ac9';
        else if(tiltNum > 0.9) badge.style.color = '#e5cf86';
        else badge.style.color = '#be9e5a';
        // Entity count now only reflects BioLoader, AviationLoader, events — not OSM entities
        const stats = `Entities: ${engine.entities.length}<br>Blueprints: ${engine.entities.filter(e=>e._bpKey).length}`;
        document.getElementById('debug-stats').innerHTML = stats;
    });
    engine.on('fetch:start', () => { document.getElementById('loading-toast').style.display = 'block'; });
    engine.on('fetch:done', () => { document.getElementById('loading-toast').style.display = 'none'; });
    setInterval(() => {
        const el = document.getElementById('hud-elevation');
        if(elevationLoader.status === 'ready') el.innerHTML = '▲ elevation ready';
        else if(elevationLoader.status === 'loading') el.innerHTML = '⟳ loading elev.';
        else el.innerHTML = '⚠ elevation offline';
    }, 700);
    document.getElementById('zoom-in').onclick = () => engine.camera.zoomIn(canvas.width/2, canvas.height/2);
    document.getElementById('zoom-out').onclick = () => engine.camera.zoomOut(canvas.width/2, canvas.height/2);
    document.getElementById('rot-left').onclick = () => engine.camera.rotateLeft();
    document.getElementById('rot-right').onclick = () => engine.camera.rotateRight();
    setTimeout(() => engine._centreCameraOnPlayer(), 120);
</script>
</body>
</html>
